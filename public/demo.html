<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%234f46e5%27/%3E%3C/svg%3E" />
  <title>Test page</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #202124; background: #fff; display: flex; flex-direction: column; min-height: 100vh; }
    header { display: flex; justify-content: flex-end; align-items: center; gap: 20px; padding: 16px 24px; color: #5f6368; }
    header .name { margin-right: auto; font-weight: 600; color: #202124; font-size: 16px; opacity: 0; transition: opacity .2s; }
    body.active header .name { opacity: 1; }
    main { flex: 1; width: 100%; max-width: 760px; margin: 0 auto; padding: 0 16px 24px; }
    body.active main { padding-bottom: 0; }
    .logo { text-align: center; margin: 18vh 0 28px; transition: margin .3s ease; }
    .logo h1 { margin: 0; font-size: clamp(36px, 7vw, 64px); font-weight: 600; letter-spacing: -.03em; line-height: 1.05; color: var(--brand, #4f46e5); }
    body.active .logo { margin: 0; height: 0; overflow: hidden; }
    footer { background: #f2f2f2; color: #70757a; font-size: 13px; padding: 14px 24px; text-align: center; border-top: 1px solid #dadce0; }
    @media (max-width: 640px) { header .links { display: none; } .logo { margin-top: 12vh; } }
  </style>
</head>
<body>
  <header>
    <span class="name" id="name"></span>
    <span class="links">Services</span><span class="links">About</span><span class="links">Contact</span>
  </header>
  <main>
    <div class="logo"><h1 id="logo">&nbsp;</h1></div>
    <div id="search"></div>
  </main>
  <footer>This is a Maven test page, not your real website. Add the search box to your site with the snippet in your dashboard's <b>Install</b> tab.</footer>
  <script src="/widget.js" data-manual="true"></script>
  <script>
    const key = location.pathname.split("/").pop();
    fetch("/api/widget/" + encodeURIComponent(key) + "/config").then((r) => r.json()).then((cfg) => {
      document.title = cfg.businessName;
      document.getElementById("logo").textContent = cfg.businessName;
      document.getElementById("name").textContent = cfg.businessName;
      document.body.style.setProperty("--brand", cfg.color);
    });
    const setActive = (on) => document.body.classList.toggle("active", on);
    document.addEventListener("maven:active", () => setActive(true));
    document.addEventListener("maven:reset", () => setActive(false));
    // Fill the screen below the header, so the input sits at the bottom once a conversation starts.
    MavenWidget.mount({ key, mode: "search", target: "#search", minHeight: "calc(100vh - 64px)" });
    // A returning visitor's earlier answers are restored, so start in the results layout.
    if (document.querySelector("#search [data-maven-widget]").shadowRoot.querySelector(".s.active")) setActive(true);
  </script>
</body>
</html>
